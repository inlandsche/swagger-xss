swagger: '2.0'
info:
  version: "1.0.0"
  title: "Login Page"
  description: |
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .login-form {
        width: 360px;
        margin: 40px auto;
        padding: 30px;
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      }
      .login-form h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 22px;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        color: #555;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 14px;
      }
      .form-group input:focus {
        outline: none;
        border-color: #4a90e2;
      }
      .btn {
        width: 100%;
        padding: 10px;
        background: #4a90e2;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 15px;
        cursor: pointer;
      }
      .btn:hover {
        background: #357abd;
      }
      .ctf-note {
        margin-top: 15px;
        font-size: 12px;
        text-align: center;
        color: #999;
      }
    </style>

    <div class="login-form">
      <h1>HTML Injection – Fake Login</h1>
      <form action="#" method="post">
        <div class="form-group">
          <label>Username</label>
          <input type="text" placeholder="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <button type="submit" class="btn">Login</button>
        </div>
      </form>
      <div class="ctf-note">
        CTF demo – no real authentication
      </div>
    </div>

paths:
  /:
    post:
      responses:
        '200':
          description: >
            Swagger UI HTML Injection demonstration
